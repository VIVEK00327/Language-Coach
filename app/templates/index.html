<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Coach</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main>
    <h1>Language Coach</h1>
    <p>Pick a language and word, record yourself, and get feedback. (Starter page: Role 4 builds the real UI.)</p>
    <label>Language <select id="language"></select></label>
    <label>Word <select id="word"></select></label>
    <div>
      <button id="record">Record</button>
      <button id="stop" disabled>Stop &amp; check</button>
    </div>
    <pre id="result"></pre>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
